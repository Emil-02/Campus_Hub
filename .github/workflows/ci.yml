name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # pubspec.yaml declares .env as an asset; CI uses the placeholder values.
      - run: cp .env.example .env
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
